services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?Set CRM_DB_PASSWORD in .env}
    volumes:
      - crm-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U crm -d crm']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/crm
      SPRING_DATASOURCE_USERNAME: crm
      SPRING_DATASOURCE_PASSWORD: ${CRM_DB_PASSWORD:?Set CRM_DB_PASSWORD in .env}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?Set CRM_DB_PASSWORD in .env}
      CRM_JWT_SECRET: ${CRM_JWT_SECRET:?Set CRM_JWT_SECRET in .env}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:?Set CRM_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8081:8081'
  frontend:
    build: ./frontend
    environment:
      CRM_BACKEND_URL: http://backend:8081
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      - backend
volumes:
  crm-data:
